<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="omniGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#2563EB" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="56" y="56" width="400" height="400" rx="100" fill="url(#omniGrad)" filter="url(#dropShadow)"/>

  <!-- Inner Ambient Glow Ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="6"/>

  <!-- Sync Loop Path 1 -->
  <path d="M 170 256 C 170 180, 230 146, 290 146 C 335 146, 365 170, 380 200" 
        fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
  <!-- Arrow Head 1 -->
  <polygon points="360,205 385,202 395,175" fill="#ffffff"/>

  <!-- Sync Loop Path 2 -->
  <path d="M 342 256 C 342 332, 282 366, 222 366 C 177 366, 147 342, 132 312" 
        fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
  <!-- Arrow Head 2 -->
  <polygon points="152,307 127,310 117,337" fill="#ffffff"/>

  <!-- Center AI Sparkle Star -->
  <path d="M 256 195 Q 256 256 317 256 Q 256 256 256 317 Q 256 256 195 256 Q 256 256 256 195 Z" 
        fill="#ffffff" filter="url(#softGlow)"/>
  
  <!-- Mini Accent Sparkles -->
  <circle cx="340" cy="180" r="6" fill="#ffffff" opacity="0.9"/>
  <circle cx="172" cy="332" r="6" fill="#ffffff" opacity="0.9"/>
</svg>
