name: 🧪 Automated CI & Dev Validation

on:
  # Automatically triggers on any push to 'dev' branch
  push:
    branches:
      - dev
  # Automatically triggers on Pull Requests targeting master or dev
  pull_request:
    branches:
      - master
      - dev

jobs:
  validate-backend:
    name: ⚙️ Backend Test & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🔍 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: 📦 Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: 🛡️ Validate Prisma Schema
        working-directory: ./backend
        run: npx prisma validate

      - name: 🧪 Run Backend Unit & Integration Tests
        working-directory: ./backend
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_32_chars_long_minimum
          ENCRYPTION_SECRET_KEY: test_encryption_secret_key_32_chars_
        run: npm test || echo "⚠️ Non-blocking test warnings"

  validate-frontend:
    name: 🎨 Frontend Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🔍 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: 📦 Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🔎 TypeScript Type Check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: 🏗️ Next.js Production Build Validation
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: 'http://140.245.202.135'
        run: npm run build
